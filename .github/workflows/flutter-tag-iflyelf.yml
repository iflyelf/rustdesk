name: Flutter Tag Build IFLYELF

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'

permissions:
  contents: write
  actions: write

jobs:
  run-flutter-tag-build:
    uses: ./.github/workflows/flutter-build-iflyelf.yml
    secrets: inherit
    permissions:
      contents: write
      actions: write
    with:
      upload-artifact: true
      upload-tag: ${{ github.ref_name }}
