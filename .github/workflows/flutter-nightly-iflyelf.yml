name: Flutter Nightly Build IFLYELF

on:
  schedule:
    # schedule build every night
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build-iflyelf.yml
    secrets: inherit
    permissions:
      contents: write
      actions: write
    with:
      upload-artifact: true
      upload-tag: "nightly"
